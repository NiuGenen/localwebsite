<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共享目录浏览 - 本地文件站</title>
    <link rel="stylesheet" href="/css/style.css?v=21">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/js/github.min.css" id="hljs-theme">
</head>
<body>
    <header>
        <h1>本地文件站</h1>
        <nav>
            <a href="/">首页</a>
            <a href="/files/">文件浏览</a>
            <a href="/reader.html">Markdown阅读</a>
            <a href="/peers.html">局域网共享</a>
            <a href="/info.html">关于</a>
        </nav>
    </header>
    <main>
        <section class="fb-panel">
            <div class="fb-toolbar">
                <div class="fb-toolbar-left">
                    <a href="/peers.html" class="fb-bread-home" id="peer-back"><i class="fas fa-arrow-left"></i> 返回共享列表</a>
                    <span class="fb-path" id="fb-path"></span>
                    <span class="fb-count" id="fb-count"></span>
                </div>
                <div class="fb-actions" id="fb-peer-title"></div>
            </div>
            <div id="fb-error" class="fb-error" style="display:none"></div>
            <div id="fb-loading" class="fb-loading">加载中...</div>
            <table class="fb-table" id="fb-table" style="display:none">
                <thead>
                    <tr>
                        <th class="fb-col-icon"></th>
                        <th class="fb-col-name">名称</th>
                        <th class="fb-col-size">大小</th>
                        <th class="fb-col-date">修改时间</th>
                        <th class="fb-col-op">操作</th>
                    </tr>
                </thead>
                <tbody id="fb-tbody"></tbody>
            </table>
            <div id="fb-empty" class="fb-empty" style="display:none">此目录为空</div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 本地文件站</p>
    </footer>

    <div class="reader-overlay" id="peer-reader" style="display:none">
        <div class="reader-panel">
            <div class="reader-toolbar" id="reader-toolbar">
                <button type="button" class="btn btn-sm" id="peer-reader-back"><i class="fas fa-arrow-left"></i> 返回列表</button>
                <span id="reader-filename"></span>
                <button type="button" class="btn btn-sm btn-copy" id="peer-reader-copy">复制全文</button>
            </div>
            <div class="reader-body" id="reader-content"></div>
        </div>
    </div>

    <div class="reader-overlay" id="peer-doc-reader" style="display:none">
        <div class="reader-panel reader-panel-doc">
            <div class="doc-reader-toolbar" id="doc-reader-toolbar">
                <button type="button" class="btn btn-sm" id="peer-doc-back"><i class="fas fa-arrow-left"></i> 返回列表</button>
                <span id="peer-doc-filename"></span>
                <button type="button" class="btn btn-sm btn-copy" id="peer-doc-download" title="下载原文件"><i class="fas fa-download"></i></button>
            </div>
            <div class="reader-body reader-body-frame"><iframe id="peer-doc-frame" class="doc-reader-frame"></iframe></div>
        </div>
    </div>

    <script src="/js/marked.min.js"></script>
    <script src="/js/highlight.min.js"></script>
    <script src="/js/copy.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/peer.js?v=4"></script>
</body>
</html>
