<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易 Markdown 阅读器 - 本地文件站</title>
    <link rel="stylesheet" href="/css/style.css?v=22">
    <link rel="stylesheet" href="/js/github.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>简易 Markdown 阅读器</h1>
        <nav>
            <a href="/">← 返回首页</a>
        </nav>
    </header>
    <main>
        <div id="md-drop-wrap">
            <div class="md-dropzone" id="md-dropzone">
                <div class="md-drop-icon">📄</div>
                <p class="md-drop-title">将 Markdown 文件拖拽到此处</p>
                <p class="md-drop-hint">或点击此处选择文件 · 支持 .md</p>
            </div>
            <p id="md-error" class="md-error" style="display:none"></p>
        </div>

        <div class="md-reading" id="md-reading" style="display:none">
            <div class="fb-toolbar">
                <div class="fb-toolbar-left">
                    <span class="md-filename" id="md-filename"></span>
                </div>
                <div class="fb-actions">
                    <button type="button" class="btn btn-sm btn-success" id="md-export">
                        <i class="fas fa-download"></i> 导出 HTML
                    </button>
                    <button type="button" class="btn btn-sm" id="md-reset">重新开始</button>
                </div>
            </div>
            <div class="md-content">
                <div id="reader-content"></div>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 本地文件站 · 简易阅读</p>
    </footer>

    <input type="file" id="md-file-input" accept=".md,.markdown" style="display:none">
    <script src="/js/marked.min.js"></script>
    <script src="/js/highlight.min.js"></script>
    <script src="/js/mdreader.js?v=1"></script>
</body>
</html>
