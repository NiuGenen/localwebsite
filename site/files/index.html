<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件浏览 - 本地文件站</title>
    <link rel="stylesheet" href="/css/style.css?v=3">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>本地文件站</h1>
        <nav>
            <a href="/">首页</a>
            <a href="/files/" class="active">文件浏览</a>
            <a href="/reader.html">Markdown阅读</a>
            <a href="/info.html">关于</a>
        </nav>
    </header>
    <main>
        <section class="fb-panel">
            <div class="fb-toolbar">
                <div class="fb-toolbar-left">
                    <span class="fb-path" id="fb-path"></span>
                    <span class="fb-count" id="fb-count"></span>
                </div>
                <div class="fb-actions" id="fb-actions">
                    <button type="button" class="btn btn-sm fb-action-btn" id="fb-upload-btn" title="上传文件到当前目录">
                        <i class="fas fa-upload"></i> 上传文件
                    </button>
                    <button type="button" class="btn btn-sm btn-success fb-action-btn" id="fb-mkdir-btn" title="在当前目录新建文件夹">
                        <i class="fas fa-folder-plus"></i> 新建文件夹
                    </button>
                    <button type="button" class="btn btn-sm btn-move fb-action-btn" id="fb-paste-btn" title="粘贴已剪切的文件到当前目录" disabled>
                        <i class="fas fa-paste"></i> 粘贴
                    </button>
                    <input type="file" id="fb-file-input" multiple style="display:none">
                </div>
            </div>
            <div id="fb-msg" class="fb-msg" style="display:none"></div>
            <div id="fb-error" class="fb-error" style="display:none"></div>
            <div id="fb-loading" class="fb-loading">加载中...</div>
            <table class="fb-table" id="fb-table" style="display:none">
                <thead>
                    <tr>
                        <th class="fb-col-icon"></th>
                        <th class="fb-col-name">名称</th>
                        <th class="fb-col-size">大小</th>
                        <th class="fb-col-date">修改时间</th>
                        <th class="fb-col-op">操作</th>
                    </tr>
                </thead>
                <tbody id="fb-tbody"></tbody>
            </table>
            <div id="fb-empty" class="fb-empty" style="display:none">此目录为空</div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 本地文件站</p>
    </footer>

    <div class="fb-modal-overlay" id="fb-modal" style="display:none">
        <div class="fb-modal">
            <h3 class="fb-modal-title">新建文件夹</h3>
            <input type="text" id="fb-modal-input" class="fb-modal-input" placeholder="输入文件夹名称">
            <p class="fb-modal-hint" id="fb-modal-hint"></p>
            <div class="fb-modal-actions">
                <button type="button" class="btn" id="fb-modal-cancel">取消</button>
                <button type="button" class="btn btn-success" id="fb-modal-confirm">创建</button>
            </div>
        </div>
    </div>

    <script>
(function () {
    var tbody = document.getElementById('fb-tbody');
    var table = document.getElementById('fb-table');
    var loading = document.getElementById('fb-loading');
    var error = document.getElementById('fb-error');
    var empty = document.getElementById('fb-empty');
    var pathEl = document.getElementById('fb-path');
    var countEl = document.getElementById('fb-count');
    var msgEl = document.getElementById('fb-msg');
    var uploadBtn = document.getElementById('fb-upload-btn');
    var mkdirBtn = document.getElementById('fb-mkdir-btn');
    var pasteBtn = document.getElementById('fb-paste-btn');
    var fileInput = document.getElementById('fb-file-input');
    var modal = document.getElementById('fb-modal');
    var modalInput = document.getElementById('fb-modal-input');
    var modalHint = document.getElementById('fb-modal-hint');
    var modalConfirm = document.getElementById('fb-modal-confirm');
    var modalCancel = document.getElementById('fb-modal-cancel');

    var currentPath = '';
    var currentBlocked = false;
    var msgTimer = null;
    var cutItem = null;

    function getPath() {
        return window.location.hash.replace(/^#\/*/, '');
    }

    function humanSize(bytes) {
        if (bytes === 0) return '-';
        var units = ['B', 'KB', 'MB', 'GB', 'TB'];
        var i = 0;
        var size = bytes;
        while (size >= 1024 && i < units.length - 1) {
            size /= 1024;
            i++;
        }
        return size.toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
    }

    function fmtDate(ts) {
        var d = new Date(ts * 1000);
        var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
            + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function renderBreadcrumb(path) {
        var parts = path ? path.split('/') : [];
        var html = '<a href="#/" class="fb-bread-home"><i class="fas fa-home"></i> files</a>';
        var acc = '';
        parts.forEach(function (p, i) {
            if (!p) return;
            acc += (acc ? '/' : '') + p;
            html += '<span class="fb-bread-sep">/</span>';
            if (i === parts.length - 1) {
                html += '<span class="fb-bread-current">' + escHtml(p) + '</span>';
            } else {
                html += '<a href="#/' + acc + '" class="fb-bread-link">' + escHtml(p) + '</a>';
            }
        });
        return html;
    }

    function escHtml(s) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(s));
        return div.innerHTML;
    }

    function getIconHtml(name, type) {
        if (type === 'dir') {
            return '<i class="fas fa-folder" style="color:#e67e22"></i>';
        }
        var ext = name.split('.').pop().toLowerCase();
        var iconMap = {
            pdf: 'fa-file-pdf', zip: 'fa-file-archive', tar: 'fa-file-archive',
            gz: 'fa-file-archive', tgz: 'fa-file-archive', rar: 'fa-file-archive',
            '7z': 'fa-file-archive', deb: 'fa-file-archive',
            png: 'fa-file-image', jpg: 'fa-file-image', jpeg: 'fa-file-image',
            gif: 'fa-file-image', svg: 'fa-file-image',
            md: 'fa-file-lines', txt: 'fa-file-lines',
            json: 'fa-file-code', bin: 'fa-file-binary',
            iso: 'fa-file', html: 'fa-file-code', htm: 'fa-file-code',
            py: 'fa-file-code', js: 'fa-file-code', css: 'fa-file-code'
        };
        var icon = iconMap[ext] || 'fa-file';
        return '<i class="fas ' + icon + '" style="color:#7f8c8d"></i>';
    }

    function buildRow(entry, path) {
        var tr = document.createElement('tr');
        tr.className = entry.type === 'dir' ? 'fb-row-dir' : 'fb-row-file';

        var iconTd = document.createElement('td');
        iconTd.className = 'fb-col-icon';
        iconTd.innerHTML = getIconHtml(entry.name, entry.type);
        tr.appendChild(iconTd);

        var nameTd = document.createElement('td');
        nameTd.className = 'fb-col-name';
        if (entry.type === 'dir') {
            var childPath = path ? path + '/' + entry.name : entry.name;
            var link = document.createElement('a');
            link.href = '#/' + childPath;
            link.className = 'fb-link fb-link-dir';
            link.textContent = entry.name;
            nameTd.appendChild(link);
        } else {
            var filePath = '/files/' + (path ? path + '/' + entry.name : entry.name);
            var link = document.createElement('a');
            link.href = filePath;
            link.className = 'fb-link fb-link-file';
            link.target = '_blank';
            link.textContent = entry.name;
            nameTd.appendChild(link);
        }
        tr.appendChild(nameTd);

        var sizeTd = document.createElement('td');
        sizeTd.className = 'fb-col-size';
        sizeTd.textContent = entry.type === 'dir' ? '-' : humanSize(entry.size);
        tr.appendChild(sizeTd);

        var dateTd = document.createElement('td');
        dateTd.className = 'fb-col-date';
        dateTd.textContent = fmtDate(entry.mtime);
        tr.appendChild(dateTd);

        var opTd = document.createElement('td');
        opTd.className = 'fb-col-op';
        if (entry.type === 'file') {
            var cutBtn = document.createElement('button');
            cutBtn.type = 'button';
            cutBtn.className = 'fb-cut-btn';
            cutBtn.title = '剪切此文件';
            cutBtn.innerHTML = '<i class="fas fa-scissors"></i> 剪切';
            cutBtn.disabled = currentBlocked;
            cutBtn.addEventListener('click', function () {
                doCut(tr, entry, path);
            });
            opTd.appendChild(cutBtn);
        }
        tr.appendChild(opTd);
        tr.dataset.name = entry.name;

        return tr;
    }

    function setButtonsEnabled(enabled) {
        uploadBtn.disabled = !enabled || currentBlocked;
        mkdirBtn.disabled = !enabled || currentBlocked;
        pasteBtn.disabled = !enabled || currentBlocked || !cutItem;
        if (currentBlocked && enabled) {
            uploadBtn.title = '当前目录不允许上传';
            mkdirBtn.title = '当前目录不允许新建文件夹';
            pasteBtn.title = '当前目录不允许粘贴';
        } else {
            uploadBtn.title = '上传文件到当前目录';
            mkdirBtn.title = '在当前目录新建文件夹';
            pasteBtn.title = cutItem
                ? '粘贴 ' + cutItem.name + ' 到当前目录'
                : '粘贴已剪切的文件到当前目录';
        }
    }

    function doCut(tr, entry, path) {
        var rows = tbody.querySelectorAll('.fb-row-cut');
        rows.forEach(function (r) { r.classList.remove('fb-row-cut'); });
        cutItem = { path: (path ? path + '/' : '') + entry.name, name: entry.name };
        tr.classList.add('fb-row-cut');
        showMsg('已剪切: ' + entry.name + '，请导航到目标文件夹后点击「粘贴」', false);
        setButtonsEnabled(true);
    }

    function doPaste() {
        if (!cutItem) return;
        pasteBtn.disabled = true;
        showMsg('正在移动 ' + cutItem.name + ' ...', false);

        fetch('/api/move', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ src: cutItem.path, dst: currentPath })
        })
            .then(function (r) {
                return r.json().then(function (d) {
                    return { ok: r.ok, data: d };
                });
            })
            .then(function (res) {
                if (res.ok) {
                    showMsg('已移动: ' + res.data.name + ' → ' + (res.data.to || '根目录'), false);
                    cutItem = null;
                    tbody.querySelectorAll('.fb-row-cut').forEach(function (r) { r.classList.remove('fb-row-cut'); });
                    loadDir(currentPath);
                } else {
                    showMsg('移动失败: ' + (res.data.error || '未知错误'), true);
                    setButtonsEnabled(true);
                }
            })
            .catch(function () {
                showMsg('移动失败: 网络错误', true);
                setButtonsEnabled(true);
            });
    }

    function showMsg(text, isErr) {
        clearTimeout(msgTimer);
        msgEl.textContent = text;
        msgEl.className = 'fb-msg ' + (isErr ? 'fb-msg-err' : 'fb-msg-ok');
        msgEl.style.display = '';
        msgTimer = setTimeout(function () {
            msgEl.style.display = 'none';
        }, 4000);
    }

    function loadDir(path) {
        currentPath = path || '';
        loading.style.display = '';
        table.style.display = 'none';
        empty.style.display = 'none';
        error.style.display = 'none';
        tbody.innerHTML = '';
        setButtonsEnabled(false);

        var url = '/api/files' + (currentPath ? '?path=' + encodeURIComponent(currentPath) : '');
        fetch(url)
            .then(function (r) {
                if (!r.ok) throw new Error('请求失败 (HTTP ' + r.status + ')');
                return r.json();
            })
            .then(function (data) {
                loading.style.display = 'none';
                currentBlocked = !!data.blocked;
                setButtonsEnabled(true);
                var entries = data.entries;
                if (!entries || entries.length === 0) {
                    empty.style.display = '';
                    pathEl.innerHTML = renderBreadcrumb(currentPath);
                    countEl.textContent = '0 项';
                    return;
                }

                var dirs = entries.filter(function (e) { return e.type === 'dir'; });
                var files = entries.filter(function (e) { return e.type === 'file'; });

                dirs.forEach(function (d) {
                    tbody.appendChild(buildRow(d, currentPath));
                });
                files.forEach(function (f) {
                    tbody.appendChild(buildRow(f, currentPath));
                });

                if (cutItem) {
                    var cutDir = cutItem.path.indexOf('/') >= 0
                        ? cutItem.path.slice(0, cutItem.path.lastIndexOf('/'))
                        : '';
                    if (cutDir === currentPath) {
                        tbody.querySelectorAll('tr').forEach(function (r) {
                            if (r.dataset.name === cutItem.name) {
                                r.classList.add('fb-row-cut');
                            }
                        });
                    }
                }

                table.style.display = '';
                pathEl.innerHTML = renderBreadcrumb(currentPath);
                countEl.textContent = entries.length + ' 项';
            })
            .catch(function (err) {
                loading.style.display = 'none';
                setButtonsEnabled(true);
                error.style.display = '';
                error.textContent = '加载失败: ' + err.message;
                pathEl.innerHTML = renderBreadcrumb(currentPath);
                countEl.textContent = '';
            });
    }

    // ===== 上传 =====
    uploadBtn.addEventListener('click', function () {
        if (uploadBtn.disabled) return;
        fileInput.click();
    });

    fileInput.addEventListener('change', function () {
        var files = fileInput.files;
        if (!files || files.length === 0) return;

        var fd = new FormData();
        if (currentPath) fd.append('path', currentPath);
        for (var i = 0; i < files.length; i++) {
            fd.append('file', files[i]);
        }

        uploadBtn.disabled = true;
        mkdirBtn.disabled = true;
        showMsg('正在上传 ' + files.length + ' 个文件...', false);

        fetch('/api/upload', { method: 'POST', body: fd })
            .then(function (r) {
                return r.json().then(function (data) {
                    return { ok: r.ok, data: data };
                });
            })
            .then(function (res) {
                if (res.ok) {
                    showMsg('上传成功: ' + res.data.names.join(', '), false);
                    loadDir(currentPath);
                } else {
                    showMsg('上传失败: ' + (res.data.error || '未知错误'), true);
                    setButtonsEnabled(true);
                }
            })
            .catch(function () {
                showMsg('上传失败: 网络错误', true);
                setButtonsEnabled(true);
            });

        fileInput.value = '';
    });

    // ===== 新建文件夹 =====
    function openModal() {
        modalInput.value = '';
        modalHint.textContent = '';
        modalHint.className = 'fb-modal-hint';
        modal.style.display = 'flex';
        modalInput.focus();
    }

    function closeModal() {
        modal.style.display = 'none';
    }

    function doMkdir() {
        var name = modalInput.value.trim();
        if (!name) {
            modalHint.textContent = '请输入文件夹名称';
            modalHint.className = 'fb-modal-hint fb-modal-hint-err';
            return;
        }
        modalConfirm.disabled = true;
        modalConfirm.textContent = '创建中...';
        modalHint.textContent = '';

        fetch('/api/mkdir', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ parent: currentPath, name: name })
        })
            .then(function (r) {
                return r.json().then(function (data) {
                    return { ok: r.ok, data: data };
                });
            })
            .then(function (res) {
                if (res.ok) {
                    closeModal();
                    showMsg('已创建文件夹: ' + res.data.path, false);
                    loadDir(currentPath);
                } else {
                    modalHint.textContent = res.data.error || '创建失败';
                    modalHint.className = 'fb-modal-hint fb-modal-hint-err';
                }
            })
            .catch(function () {
                modalHint.textContent = '网络错误';
                modalHint.className = 'fb-modal-hint fb-modal-hint-err';
            })
            .finally(function () {
                modalConfirm.disabled = false;
                modalConfirm.textContent = '创建';
            });
    }

    mkdirBtn.addEventListener('click', function () {
        if (mkdirBtn.disabled) return;
        openModal();
    });

    pasteBtn.addEventListener('click', function () {
        if (pasteBtn.disabled) return;
        doPaste();
    });

    modalConfirm.addEventListener('click', doMkdir);
    modalCancel.addEventListener('click', closeModal);
    modalInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); doMkdir(); }
        if (e.key === 'Escape') { closeModal(); }
    });
    modal.addEventListener('click', function (e) {
        if (e.target === modal) closeModal();
    });

    // ===== 路由 =====
    function onHashChange() {
        loadDir(getPath());
    }

    window.addEventListener('hashchange', onHashChange);
    if (!window.location.hash) {
        window.location.hash = '/';
    } else {
        onHashChange();
    }
})();
    </script>
</body>
</html>
