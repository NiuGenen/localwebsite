<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地文件站</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>本地文件站</h1>
        <nav>
            <a href="/" class="active">首页</a>
            <a href="/reader.html">Markdown</a>
            <a href="/upload">文件上传</a>
            <a href="/info.html">关于</a>
            <a href="/files/">文件下载</a>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h2>欢迎访问本地文件站</h2>
            <p class="hero-subtitle">文件共享 · 信息阅读 · Markdown 渲染</p>
            <p class="hero-desc">这是一个用于文件下载和信息阅读的本地网站。</p>
        </section>
        <section class="quick-links">
            <div class="card card-download">
                <div class="card-icon">📂</div>
                <h3>文件下载</h3>
                <p>浏览并下载共享文件。</p>
                <a href="/files/" class="btn">进入文件区</a>
            </div>
            <div class="card card-upload">
                <div class="card-icon">📤</div>
                <h3>文件上传</h3>
                <p>文件上传到共享目录。</p>
                <a href="/upload" class="btn">文件上传</a>
            </div>
            <div class="card card-reader">
                <div class="card-icon">📝</div>
                <h3>Markdown 阅读</h3>
                <p>在线阅读 Markdown 文件，支持表格和代码高亮。</p>
                <a href="/reader.html" class="btn">开始阅读</a>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 本地文件站</p>
    </footer>
</body>
</html>
