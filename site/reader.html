<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 阅读器</title>
    <link rel="stylesheet" href="/css/style.css?v=48">
    <link rel="stylesheet" href="/js/github.min.css" id="hljs-theme">
</head>
<body>
    <header>
        <h1>Markdown 阅读器</h1>
        <nav>
            <a href="/">首页</a>
            <a href="/weekly.html">每周周报</a>
            <a href="/files/">文件浏览</a>
            <a href="/peers.html">局域网共享</a>
            <a href="/info.html">关于</a>
        </nav>
    </header>
    <main>
        <div id="reader-app">
            <div id="file-list">
                <div class="md-file-list-head">
                    <h2>选择 Markdown 文件</h2>
                    <label class="md-file-sort" for="md-file-sort">
                        <span>显示顺序</span>
                        <select id="md-file-sort">
                            <option value="created-desc">创建时间（新→旧）</option>
                            <option value="created-asc">创建时间（旧→新）</option>
                            <option value="name-asc">文件名（正序）</option>
                            <option value="name-desc">文件名（倒序）</option>
                        </select>
                    </label>
                </div>
                <div id="md-file-list"></div>
                <p id="file-list-empty" style="display:none;color:#999;">暂无 Markdown 文件</p>
            </div>
            <div id="reading-view" style="display:none">
                <div id="reader-toolbar">
                    <a href="/reader.html" class="btn" id="btn-back">← 文件列表</a>
                    <span id="reader-filename"></span>
                    <button type="button" class="btn btn-sm btn-success" id="btn-export">导出 HTML</button>
                    <button type="button" class="btn btn-sm btn-copy" id="btn-copy">复制全文</button>
                </div>
                <div id="reader-content"></div>
            </div>
            <div id="reader-loading" style="display:none">
                <p>加载中...</p>
            </div>
            <div id="reader-error" style="display:none">
                <p id="reader-error-msg"></p>
                <a href="/reader.html" class="btn">← 返回文件列表</a>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 本地文件站</p>
    </footer>
    <script src="/js/marked.min.js"></script>
    <script src="/js/highlight.min.js"></script>
    <script src="/js/md-diagram.js"></script>
    <script src="/js/copy.js"></script>
    <script>
(function () {
    var fileListEl = document.getElementById('file-list');
    var readingViewEl = document.getElementById('reading-view');
    var loadingEl = document.getElementById('reader-loading');
    var errorEl = document.getElementById('reader-error');
    var errorMsgEl = document.getElementById('reader-error-msg');
    var contentEl = document.getElementById('reader-content');
    var filenameEl = document.getElementById('reader-filename');
    var fileListContainer = document.getElementById('md-file-list');
    var emptyEl = document.getElementById('file-list-empty');
    var sortEl = document.getElementById('md-file-sort');
    var copyBtn = document.getElementById('btn-copy');
    var exportBtn = document.getElementById('btn-export');
    var mdFiles = [];
    var currentBase = '';
    var currentMdText = '';
    var currentMdName = '';
    var diagramPromise = Promise.resolve();
    var copyTimer = null;

    function show(el) { if (el) el.style.display = ''; }
    function hide(el) { if (el) el.style.display = 'none'; }

    function getQueryParam(name) {
        var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
        if (!m) return null;
        try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; }
    }

    function getFileName(path) {
        var parts = path.replace(/\\/g, '/').split('/');
        return parts[parts.length - 1] || path;
    }

    function escHtml(s) {
        var d = document.createElement('div');
        d.appendChild(document.createTextNode(s));
        return d.innerHTML;
    }

    function relativePath(baseDir, target) {
        var from = baseDir.split('/').filter(Boolean);
        var to = target.split('/').filter(Boolean);
        while (from.length && to.length && from[0] === to[0]) {
            from.shift();
            to.shift();
        }
        return '../'.repeat(from.length) + to.join('/');
    }

    var EXPORT_CSS =
        'body{margin:0;background:#f5f5f5;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.75;}' +
        '.mdpage{max-width:880px;margin:24px auto;background:#fff;padding:24px 36px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08);word-break:break-word;}' +
        'h1,h2,h3,h4,h5,h6{color:#2c3e50;line-height:1.35;}' +
        'h1{font-size:1.8em;border-bottom:2px solid #eee;padding-bottom:.3em;}' +
        'h2{font-size:1.5em;border-bottom:1px solid #eee;padding-bottom:.2em;}' +
        'a{color:#3498db;}img{max-width:100%;height:auto;}' +
        '.mermaid-img{display:block;max-width:100%;height:auto;margin:1em auto;background:#fff;}' +
        'table{border-collapse:collapse;margin:1em 0;}' +
        'th,td{border:1px solid #ddd;padding:.5em .8em;text-align:left;}' +
        'th{background:#f6f8fa;}' +
        'blockquote{margin:1em 0;padding:.5em 1em;border-left:4px solid #3498db;background:#f8fafc;color:#555;}' +
        'pre{background:#f6f8fa;border:1px solid #e1e4e8;border-radius:6px;padding:1em;overflow-x:auto;}' +
        'code{background:#f0f0f0;padding:.15em .4em;border-radius:3px;font-family:"Fira Code",Menlo,Consolas,monospace;font-size:.88em;}' +
        'pre code{background:none;padding:0;}' +
        'hr{border:none;border-top:1px solid #eee;margin:1.5em 0;}' +
        '.hljs{color:#24292e;background:transparent}' +
        '.hljs-comment,.hljs-quote{color:#6a737d;font-style:italic}' +
        '.hljs-keyword,.hljs-selector-tag,.hljs-subst{color:#d73a49}' +
        '.hljs-number,.hljs-literal,.hljs-variable,.hljs-template-variable,.hljs-tag .hljs-attr{color:#005cc5}' +
        '.hljs-string,.hljs-doctag,.hljs-regexp{color:#032f62}' +
        '.hljs-title,.hljs-section,.hljs-selector-id{color:#6f42c1;font-weight:600}' +
        '.hljs-type,.hljs-class .hljs-title{color:#e36209}' +
        '.hljs-attribute,.hljs-name{color:#6f42c1}' +
        '.hljs-built_in,.hljs-symbol,.hljs-bullet{color:#e36209}' +
        '.hljs-meta{color:#6a737d}' +
        '.hljs-emphasis{font-style:italic}' +
        '.hljs-strong{font-weight:600}';

    function rewriteExportUrls(root) {
        root.querySelectorAll('[href],[src]').forEach(function (el) {
            ['href', 'src'].forEach(function (attr) {
                var value = el.getAttribute(attr);
                if (!value || /^(https?:)?\/\//i.test(value) || /^(data|mailto|tel):/i.test(value)
                        || value.charAt(0) === '#') return;

                var parts = value.match(/^([^?#]*)([?#].*)?$/);
                var path = parts ? parts[1] : value;
                var suffix = parts && parts[2] ? parts[2] : '';
                if (attr === 'href' && /\.md$/i.test(path)) {
                    path = path.replace(/\.md$/i, '.html');
                }
                if (path.charAt(0) === '/' && path.indexOf('/files/') === 0) {
                    el.setAttribute(attr, relativePath(currentBase, path.slice(1)) + suffix);
                } else if (attr === 'href' && /\.md$/i.test(path) && path.charAt(0) !== '/') {
                    el.setAttribute(attr, path.replace(/\.md$/i, '.html') + suffix);
                }
            });
        });
    }

    function downloadHtml(fullHtml, name) {
        var blob = new Blob([fullHtml], {type:'text/html;charset=utf-8'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    function exportHtml() {
        if (!currentMdText) return;
        var base = (currentMdName || 'export').replace(/\.(md|markdown)$/i, '');
        var doExport = function () {
            var holder = document.createElement('div');
            holder.innerHTML = contentEl.innerHTML;
            rewriteExportUrls(holder);
            var full = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n'
                + '<meta name="viewport" content="width=device-width,initial-scale=1">\n'
                + '<title>' + escHtml(currentMdName) + '</title>\n'
                + '<style>' + EXPORT_CSS + '</style>\n</head>\n<body>\n'
                + '<main class="mdpage">' + holder.innerHTML + '</main>\n</body>\n</html>';
            downloadHtml(full, base + '.html');
        };
        (diagramPromise || Promise.resolve()).then(doExport).catch(doExport);
    }

    function formatCreated(ts) {
        var date = new Date(Number(ts) * 1000);
        if (isNaN(date.getTime())) return '创建时间未知';
        return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0')
            + '-' + String(date.getDate()).padStart(2, '0')
            + ' ' + String(date.getHours()).padStart(2, '0')
            + ':' + String(date.getMinutes()).padStart(2, '0');
    }

    function sortedFiles() {
        var order = sortEl ? sortEl.value : 'created-desc';
        return mdFiles.slice().sort(function (a, b) {
            var nameOrder = a.name.localeCompare(b.name, 'zh-CN', {numeric:true, sensitivity:'base'});
            if (order === 'name-asc') return nameOrder;
            if (order === 'name-desc') return -nameOrder;

            var createdOrder = (Number(a.created) || 0) - (Number(b.created) || 0);
            if (order === 'created-desc') createdOrder = -createdOrder;
            return createdOrder || nameOrder;
        });
    }

    function renderFileList() {
        fileListContainer.innerHTML = '';
        if (!mdFiles.length) {
            show(emptyEl);
            return;
        }

        hide(emptyEl);
        var ul = document.createElement('ul');
        ul.className = 'md-file-items';
        sortedFiles().forEach(function (f) {
            var li = document.createElement('li');
            var link = document.createElement('a');
            link.href = '/reader.html?path=' + encodeURIComponent('files/md/' + f.name);
            link.className = 'md-file-link';

            var nameEl = document.createElement('span');
            nameEl.className = 'md-file-name';
            nameEl.textContent = f.name;
            link.appendChild(nameEl);

            var timeEl = document.createElement('time');
            timeEl.className = 'md-file-created';
            timeEl.textContent = '创建时间：' + formatCreated(f.created);
            if (Number(f.created)) timeEl.dateTime = new Date(Number(f.created) * 1000).toISOString();
            link.appendChild(timeEl);

            li.appendChild(link);
            ul.appendChild(li);
        });
        fileListContainer.appendChild(ul);
    }

    // marked 渲染器：相对路径（图片/链接）自动加前缀到当前 md 所在目录
    function setupReaderRenderer() {
        function resolveUrl(href) {
            if (!href) return href;
            if (/^(https?:)?\/\//i.test(href)) return href;
            if (href.indexOf('data:') === 0) return href;
            if (href.charAt(0) === '#' || href.charAt(0) === '/') return href;
            return '/' + currentBase + href;
        }
        marked.use({
            renderer: {
                image: function (token) {
                    return marked.Renderer.prototype.image.call(this, Object.assign({}, token, { href: resolveUrl(token.href) }));
                },
                link: function (token) {
                    return marked.Renderer.prototype.link.call(this, Object.assign({}, token, { href: resolveUrl(token.href) }));
                }
            }
        });
    }

    // --- File listing ---
    function loadFileList() {
        show(fileListEl);
        hide(readingViewEl);
        hide(loadingEl);
        hide(errorEl);
        fileListContainer.innerHTML = '<p style="color:#999;">正在扫描文件...</p>';

        fetch('/api/files?path=md')
            .then(function (r) {
                if (!r.ok) throw new Error('无法访问目录 (HTTP ' + r.status + ')');
                return r.json();
            })
            .then(function (data) {
                mdFiles = (data.entries || []).filter(function (e) {
                    return e.type === 'file' && /\.md$/i.test(e.name);
                });
                renderFileList();
            })
            .catch(function (err) {
                fileListContainer.innerHTML = '<p style="color:#c00;">加载文件列表失败: ' + err.message + '</p>';
            });
    }

    // --- Markdown rendering ---
    function renderMarkdown(path) {
        hide(fileListEl);
        hide(errorEl);
        show(loadingEl);

        var fetchPath = '/' + path.replace(/^\/+/, '');

        var idx = path.lastIndexOf('/');
        currentBase = idx >= 0 ? path.slice(0, idx + 1) : '';

        fetch(fetchPath)
            .then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status + (r.status === 404 ? ' (文件未找到)' : ''));
                return r.text();
            })
            .then(function (mdText) {
                hide(loadingEl);
                show(readingViewEl);
                filenameEl.textContent = getFileName(path);
                currentMdText = mdText;
                currentMdName = getFileName(path);

                contentEl.innerHTML = marked.parse(mdText);
                contentEl.querySelectorAll('pre code').forEach(function (block) {
                    hljs.highlightElement(block);
                });
                diagramPromise = window.renderMermaidIn ? renderMermaidIn(contentEl) : Promise.resolve();
            })
            .catch(function (err) {
                hide(loadingEl);
                show(errorEl);
                errorMsgEl.textContent = '加载文件失败: ' + err.message;
            });
    }

    // 相对 md 链接在本阅读器打开
    contentEl.addEventListener('click', function (e) {
        var a = e.target.closest('a[href]');
        if (!a) return;
        var href = a.getAttribute('href');
        if (/\.md$/i.test(href) && href.charAt(0) === '/' && href.charAt(1) !== '/') {
            e.preventDefault();
            renderMarkdown(href.replace(/^\/+/, ''));
        }
    });

    // 复制全文
    copyBtn.addEventListener('click', function () {
        if (!currentMdText) return;
        copyText(currentMdText).then(function () {
            copyBtn.textContent = '已复制 ✓';
            clearTimeout(copyTimer);
            copyTimer = setTimeout(function () { copyBtn.textContent = '复制全文'; }, 1500);
        }).catch(function () {
            copyBtn.textContent = '复制失败';
            clearTimeout(copyTimer);
            copyTimer = setTimeout(function () { copyBtn.textContent = '复制全文'; }, 1500);
        });
    });

    // --- Init ---
    setupReaderRenderer();
    if (exportBtn) exportBtn.addEventListener('click', exportHtml);
    if (sortEl) sortEl.addEventListener('change', renderFileList);
    var path = getQueryParam('path');
    if (path) {
        renderMarkdown(path);
    } else {
        loadFileList();
    }
})();
    </script>
    <script src="/js/layout.js"></script>
</body>
</html>
